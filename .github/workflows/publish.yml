name: publish

# Publishes a release in two ways:
# 1. Pushing a newly created annotated `v*` tag triggers the run automatically.
#    Only tags created after this workflow is on main can use this path.
# 2. Manual dispatch stays as the fallback for an existing tag.
# Every run verifies the tag/version pair before it touches the registry.
# The branch the button is pressed on does not matter: the run checks out the
# tag and compares against it, so dispatch from main is fine as long as the tag
# exists and its version matches package.json.
# Pre-release versions (X.Y.Z-dev.N) publish to the `dev` dist-tag only: no
# GitHub Release, `latest` untouched.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0 (must match package.json version)'
        required: true

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # npm Trusted Publishing (OIDC), no long-lived token needed

# Serialise runs per tag: a tag push and a manual dispatch for the same tag must
# never publish at the same time.
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    # A push event can also be a force-update of an existing tag; only publish
    # for tags that were newly created. Manual dispatch has no `created` field.
    if: github.event_name == 'workflow_dispatch' || github.event.created == true
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # OIDC publishing needs a recent npm; the runner's bundled one is too old.
      - run: npm install -g npm@latest && npm --version

      # The tag must be annotated (so it records who cut the release and when)
      # and its commit must already be on main; a lightweight tag or a tag on a
      # side branch would bypass the reviewed history.
      - name: Tag must be annotated and its commit on main
        shell: bash
        run: |
          if [ "$(git cat-file -t "${TAG}")" != "tag" ]; then
            echo "::error::${TAG} is not an annotated tag"
            exit 1
          fi
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${TAG}^{commit}" origin/main; then
            echo "::error::${TAG} points to a commit that is not on main"
            exit 1
          fi
          echo "${TAG} is annotated and its commit is on main."

      # Dispatch may come from any branch: the checkout above already pinned the
      # tag, so compare against the tag resolved in the job env.
      - name: Tag must match package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "${TAG}" = "v${version}" ] || {
            echo "::error::tag ${TAG} does not match package.json v${version}"
            exit 1
          }

      # A version with a pre-release suffix (1.9.1-dev.1) publishes to the dev
      # dist-tag and never creates a Release, so `latest` and the Releases page
      # stay a record of formal versions only.
      - name: Decide the dist-tag
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${version}" == *-* ]]; then
            echo "dist_tag=dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to overwrite a published version
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::error::${name}@${version} is already on the registry"
            exit 1
          fi

      - run: npm install --no-audit --no-fund

      # prepublishOnly runs `npm run check && npm test && npm run gate`; the gate
      # inspects dist/<name>-<version>.tgz, which a clean checkout does not have.
      # Pack it once first so the gate compares the real artefact, not nothing.
      - name: Pack the tarball the gate inspects
        shell: bash
        run: |
          mkdir -p dist
          npm pack --pack-destination dist

      # prepublishOnly runs `npm run check && npm test && npm run gate`, so the
      # artefact gate stays in the path; the lifecycle script used to be skipped.
      - run: npm publish --access public --tag "${{ steps.meta.outputs.dist_tag }}"

      # The release body is derived from the shipped CHANGELOG, never hand-written
      # and never generated from commit messages. See AGENTS.md §6.1.
      # Formal versions only: a pre-release publishes to the dev dist-tag and gets
      # no Release.
      - name: Derive the release body from CHANGELOG.md
        if: steps.meta.outputs.prerelease == 'false'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node -e '
            const fs = require("node:fs");
            const version = process.argv[1];
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const esc = version.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            // Keep a Changelog: "## [1.9.0] - 2026-11-22"; older sections: "## 1.9.0".
            // The trailing part must be a date, so "## [1.9.0-dev.1]" can never be
            // read as 1.9.0.
            const heading = new RegExp("^##\\s+\\[?" + esc + "\\]?(?:\\s+[-–—]\\s+\\d{4}-\\d{2}-\\d{2})?$");
            const start = lines.findIndex((l) => heading.test(l.trim()));
            if (start < 0) throw new Error("CHANGELOG.md has no section for " + version);
            let end = lines.findIndex((l, i) => i > start && /^##(?!#)\s/.test(l.trim()));
            if (end < 0) end = lines.length;
            const body = lines.slice(start + 1, end).join("\n").trim();
            const out = body
              .replace(/^\*\*中文\*\*$/m, "## 中文")
              .replace(/^\*\*(?:English|英文)\*\*$/m, "## English");
            if (!/^## 中文$/m.test(out)) throw new Error("no Chinese section for " + version);
            fs.writeFileSync("release-body.md", out + "\n");
          ' "$version"
          cat release-body.md

      - name: Build the release zip
        if: steps.meta.outputs.prerelease == 'false'
        shell: bash
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist ziproot
          npm pack --pack-destination dist
          tar -xzf "dist/${name}-${version}.tgz" -C ziproot
          mv ziproot/package "ziproot/${name}-${version}"
          (cd ziproot && zip -qr "../dist/${name}-${version}.zip" .)

      - name: Create the GitHub Release
        if: steps.meta.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          gh release create "${TAG}" "dist/${name}-${version}.zip" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file release-body.md

      - name: Verify both channels agree
        if: steps.meta.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # npm and the GitHub API need a moment to see a fresh publish. Retry
          # up to 10 times, 30s apart (300s of waiting in total), and fail only
          # after the last retry. The check script's criteria are unchanged: a
          # real mismatch still fails.
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            echo "::group::check-sync attempt ${attempt} (first try + up to 10 retries)"
            if node scripts/check-sync.mjs --token "$GH_TOKEN"; then
              echo "::endgroup::"
              echo "check-sync passed on attempt ${attempt}."
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -gt 10 ]; then
              echo "::error::check-sync still failing after 10 retries (300s)."
              exit 1
            fi
            echo "check-sync not ready (attempt ${attempt}); retrying in 30s."
            sleep 30
          done
