name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The package has one real runtime dependency (@deepseek-ai/schemastery), so a
      # clean checkout must install before it can be verified.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Test suites
        run: npm test

      # The gate inspects a packed tarball, so build one first.
      - name: Pack
        run: npm run pack

      - name: Artefact gate
        run: npm run gate
